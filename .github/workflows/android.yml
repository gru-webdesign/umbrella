name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04   # image ships with the Android SDK
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy the game into www/
        run: npm run build:web

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#41a6f6' --splashBackgroundColor '#1a1c2c'

      - name: Portrait only
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Full screen (hide status and navigation bars)
        run: cp tools/android/MainActivity.java android/app/src/main/java/com/gruwebdesign/umbrellafreefall/MainActivity.java

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Same signing key on every build (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp tools/android/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk umbrella-free-fall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: umbrella-free-fall-apk
          path: umbrella-free-fall.apk

      - name: Point the "latest" tag at this commit
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Umbrella Free Fall (latest build)
          body: Install umbrella-free-fall.apk on Android (allow installs from your browser when asked).
          make_latest: true
          files: umbrella-free-fall.apk
