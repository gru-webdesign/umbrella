<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c2c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="One-tap pixel art faller. Tap to switch the wind and drift through the alley.">
  <title>Umbrella Free Fall</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/pixelify-sans-700.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Pixelify Sans";
      src: url("fonts/pixelify-sans-700.woff2") format("woff2");
      font-weight: 700;
      font-display: block;
    }
    html, body {
      margin: 0; height: 100%; width: 100%;
      background: #1a1c2c;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* full screen: the game draws edge to edge; only the score avoids a notch */
    #safe-top { position: fixed; top: 0; left: 0; width: 1px; height: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }
    #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="safe-top"></div>
  <div id="stage">
    <canvas id="game" aria-label="Umbrella Free Fall. Tap or press space to switch the wind."></canvas>
  </div>
  <script src="src/music.js"></script>
  <script src="src/game.js"></script>
  <script>
    // inside the Android app: hide the status bar for a full-screen game
    try { window.Capacitor && window.Capacitor.Plugins.StatusBar && window.Capacitor.Plugins.StatusBar.hide(); } catch (e) {}
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
